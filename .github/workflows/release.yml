name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign Shihon and prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Verify release tag
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'versionName = "([^"]+)"', pathlib.Path('app/build.gradle.kts').read_text())[1]
          expected = 'refs/tags/v' + version
          if os.environ['GITHUB_REF'] != expected:
              raise SystemExit(f'Release must run on {expected}; select that tag when running manually.')
          PY
      - name: Check translations, formatting, tests and migrations
        run: |
          python3 scripts/check_translations.py
          ./gradlew spotlessCheck testDebugUnitTest verifySqlDelightMigration
      - name: Decode release signing key
        env:
          SIGNING_KEY: ${{ secrets.SHIHON_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'SHIHON_SIGNING_KEY is required'; exit 1; }
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/shihon-release.jks"
      - name: Build signed release
        run: ./gradlew assembleRelease
        env:
          SHIHON_KEYSTORE_PATH: ${{ runner.temp }}/shihon-release.jks
          SHIHON_STORE_PASSWORD: ${{ secrets.SHIHON_STORE_PASSWORD }}
          SHIHON_KEY_ALIAS: ${{ secrets.SHIHON_KEY_ALIAS }}
          SHIHON_KEY_PASSWORD: ${{ secrets.SHIHON_KEY_PASSWORD }}
      - name: Verify signature and generate checksums
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/*.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Upload signed APK and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Shihon-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
      - name: Upload R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: error
      - name: Prepare GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-state" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-state")" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Shihon $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/shihon-release.jks"
